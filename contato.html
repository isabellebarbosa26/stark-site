<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark - Contato</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="contato-page">
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo Stark">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="cases.html">Cases</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-interna">
        <h1>Fale Conosco</h1>
        <p>Quer moldar o software perfeito para o seu negócio? Entre em contato conosco.</p>
        
        <form class="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte sobre o seu negócio..." required></textarea>

            <button type="submit" class="btn-solido">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Stark. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
